version: 0.0.1
type: plugin
author: langgenius
name: scaleway
label:
  en_US: Scaleway Generative APIs
description:
  en_US: Use Scaleway Generative APIs (OpenAI-compatible, hosted in Europe) for LLM,
    text embedding and speech-to-text models.
icon: icon.svg
resource:
  memory: 268435456
  permission:
    model:
      enabled: true
      llm: true
      text_embedding: true
      rerank: false
      tts: false
      speech2text: true
      moderation: false
plugins:
  models:
    - provider/scaleway.yaml
meta:
  version: 0.0.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: null
created_at: 2026-11-20T00:00:00Z
